# Netlify settings (read automatically when the site is connected to this repository).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+; pin it so Netlify never builds with an older default
  NODE_VERSION = "22"

# Files in /assets have a content hash in their name (a new name whenever they change), so
# browsers may keep them for a year: repeat visits download no JavaScript, CSS or Kannada again.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Page addresses (/shop, /product/…) all serve index.html: see public/_redirects
